<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ art['title'] }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="art-detail">
    <div class="art-wrapper">
        <div class="art-left">
            <button class="back-btn" onclick="history.back()">← Back</button>
            <div class="art-image">
                <div class="artist-info">
                    <div class="artist-icon">
                    <span class="artist-name">S</span>
                    </div>
                </div>
                <img src="{{url_for('static', filename=art[2]) }}" alt="{{ art[1] }} — {{ art[3] }}; category {{ art[5] }}; medium and colors may vary; overall tone: neutral to contemplative">
            </div>

            <div class="art-details">
                <p class="rating"> 5/5</p>
                <p><strong>Art Title:</strong> {{ art[1] }}</p>
                <p><strong>Description</strong> {{ art[3] }}</p>
                <p><strong>Category</strong> {{ art[5] }}</p>
            </div>

            <button class="upload-btn" onclick="window.location.href='/upload'">Upload</button>
        </div>

        <div class="art-right">
            <form class="comment-form"  method="POST" action="/add_comment/{{ art['id'] }}">
                <input type="text" name="comment_text" placeholder="Add comment..." required>
                <button type="submit">Submit</button>
            </form>

            <h3>Comments</h3>
            <div class="comment-list">
                {% for c in comments %}
                <div class="comment-card">
                    <div class="comment-user">
                        <div class="user-icon">
                                <img src="https://api.dicebear.com/7.x/thumbs/svg?seed={{ c['username'] }}" alt="{{ c['username'] }} avatar showing a stylized thumbnail with initials; neutral expression">
                        </div>
                        <span class="username">{{ c['username'] }}</span>
                    </div>
                    <p class="comment-text">{{ c['comment_text'] }}</p>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
