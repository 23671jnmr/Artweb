<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="upload-wrapper">
        <div class="upload-left">
            <h2>How to Upload Images </h2>
            <hr class="upload-line"> 
            <ol>
                 <li>Click <strong>Choose File</strong> to pick an artwork imaghe from your computer or phone.</li>
                <li>Enter your name, title, and description.</li>
                <li>Choose your artwork category</li>
                <li>Click <strong>Upload</strong> to publish!</li>
            </ol>
        </div>


        <div class="upload-right">

            <form action="{{ url_for('upload') }}" method="POST" enctype="multipart/form-data">

                <div class="form-group">
                     <label for="file">Select Artwork Image:</label>
                    <input type="file" name="file" accept="image/*" required>
                </div>

                <input type="text" name="username" placeholder="Your Name..." required>
                <input type="text" name="title" placeholder="Image title..." required>
                <textarea name="description" placeholder="Image Description..." required></textarea>
                <input type="number" name="rating" min="1" max="5" placeholder="Image Rating(1-5)...required">

                <select name="category" required>
                    <option value="" disabled selected>Select Category...</option>
                    <option value="traditional">Traditional</option>
                    <option value="digital">Digital</option>
                    <option value="other">Other</option>
                </select>

                <div class="upload-buttons">
                    <button type="button" class="cancel-btn">Cancel</button>
                    <button type="submit" class="upload-button">Upload</button>
                </div>
            </form>
        </div>
    </div>
    
</body>
</html>
